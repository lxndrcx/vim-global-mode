name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: MoonBit server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh install ships no registry index, so dependency resolution fails
      # with "module was not found in the registry" until this runs.
      - name: Fetch the module registry
        run: moon update

      - name: Check formatting
        working-directory: server
        run: moon fmt --check

      - name: Check
        working-directory: server
        run: moon check --target native --deny-warn

      - name: Test
        working-directory: server
        run: moon test --target native

  plugin:
    name: Lua plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Unit tests
        run: |
          nvim -l tests/protocol_spec.lua
          nvim -l tests/api_spec.lua

      # Drives a real Neovim against a controlled server. Covers the loop-guard
      # case two-editors.sh structurally cannot reach: a mode pushed directly at
      # an editor that is in some other non-normal mode.
      - name: Loop guard
        run: node tests/loop-guard.js nvim

      # The heartbeat is the protocol's only resync. Without it, several ways an
      # editor can drift out of step with the server are permanent.
      - name: Heartbeat resync
        run: node tests/resync.js nvim

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests

  end-to-end:
    name: Two editors, one mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh install ships no registry index, so dependency resolution fails
      # with "module was not found in the registry" until this runs.
      - name: Fetch the module registry
        run: moon update

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Build the server
        working-directory: server
        run: moon build --target native

      # The server on its own, driven by fake editors -- no Neovim involved.
      - name: Server end-to-end
        run: |
          ./server/_build/native/debug/build/cmd/main/main.exe \
            --bind 127.0.0.1 --port 7777 --http-port 7778 --verbose >server.log 2>&1 &
          echo $! > server.pid
          # Poll rather than sleeping blind, so a slow runner does not look like
          # a broken server.
          for _ in $(seq 40); do
            curl -sf http://127.0.0.1:7778/api/state >/dev/null && break
            sleep 0.25
          done
          node scripts/fake-client.js --clients 3
          # A server that passed and then died leaves no other trace.
          kill -0 "$(cat server.pid)" || { echo "server died during the run"; exit 1; }

      - name: Server log
        if: failure()
        run: tail -60 server.log || true

      # The real thing: two headless Neovim instances sharing one mode.
      - name: Two real editors
        run: ./tests/two-editors.sh
