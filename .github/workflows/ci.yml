name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  plugin:
    name: Lua plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The fake servers are the independent side of the wire format, so they
      # are type-checked as strictly as the plugin is linted.
      - name: Type-check the fake servers
        run: |
          pip install --quiet pyrefly
          pyrefly check

      - name: Unit tests
        run: |
          nvim -l tests/protocol_spec.lua
          nvim -l tests/api_spec.lua

      # Drives a real Neovim against a controlled server. Covers the loop-guard
      # case two-editors.sh structurally cannot reach: a mode pushed directly at
      # an editor that is in some other non-normal mode. The server here is a
      # few lines of Node, so this job needs nothing from the server repository.
      - name: Loop guard
        run: python3 tests/loop_guard.py nvim

      # The heartbeat is the protocol's only resync. Without it, several ways an
      # editor can drift out of step with the server are permanent.
      - name: Heartbeat resync
        run: python3 tests/resync.py nvim

      # Three ways to talk a client out of listening to its own server, all of
      # which leave it saying "online" while following nobody. Needs a server
      # that restarts and a second sender, so two-editors.sh cannot reach any
      # of them.
      - name: Restart, forgery and stale refresh
        run: python3 tests/restart.py nvim

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests

  end-to-end:
    name: Two editors, one mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server lives in its own repository, so this job builds it from
      # source. That makes it a genuine cross-repository check: a wire format
      # changed on one side and not the other fails here and nowhere else.
      - name: Check out the server
        uses: actions/checkout@v4
        with:
          repository: lxndrcx/vim-global-mode-server-ada
          path: .server

      # apt's GNAT matches the runner's gcc and needs no index or network
      # beyond the package mirrors, so there is nothing here to retry.
      - name: Install GNAT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnat gprbuild

      # Release, and not merely for speed. A debug build executes the hub's
      # quantified invariants on every iteration of the server loop and is far
      # too slow to complete a second editor's handshake -- it fails in a way
      # that looks exactly like a protocol bug.
      - name: Build the server
        working-directory: .server
        run: gprbuild -P global_mode.gpr -XGLOBAL_MODE_BUILD=release

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The real thing: two headless Neovim instances sharing one mode. It
      # finds the binary under .server/ on its own.
      - name: Two real editors
        run: ./tests/two-editors.sh
